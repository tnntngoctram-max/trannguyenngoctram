name: tran_nguyen_ngoc_tram
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  jwt_decoder: ^2.0.1

  # Phần cứng & Cảm biến
  geolocator: ^11.0.0             # Tọa độ GPS
  mobile_scanner: ^5.0.0          # Quét QR Code
  sensors_plus: ^5.0.0            # Gia tốc kế (Đo lắc máy)
  noise_meter: ^5.0.0             # Đo tiếng ồn micro
  local_auth: ^2.1.8              # Vân tay / Face ID
  qr_flutter: ^4.1.0              # Hiển thị mã QR Code thực tế
  permission_handler: ^11.3.0     # Quyền thiết bị

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
